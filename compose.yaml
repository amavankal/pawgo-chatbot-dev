services:
  qdrant:
    image: qdrant/qdrant # use QDrant image from DockerHub
    container_name: pawgo-qdrant-db # name the container
    restart: unless-stopped # if container unexpectedly stops, restart it
    ports:
      - "127.0.0.1:6333:6333" # publish container port 6333 on localhost:6333
      - "127.0.0.1:6334:6334" # publish container port 6334 on localhost:6334
    volumes:
      - pawgo_qdrant_storage:/qdrant/storage # mount named volume at /qdrant/storage in container
volumes:
  pawgo_qdrant_storage: # declare the named volume managed by Docker
